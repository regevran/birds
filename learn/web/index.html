<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="birds-api" content="http://localhost:8787">
<title>Birds trainer</title>
<link rel="stylesheet" href="assets/css/palette.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/option-b.css">
<link rel="stylesheet" href="assets/css/main-b.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="opt-b main-b">
<div class="app">

  <header class="sessionbar">
    <div class="session-group">
      <button class="session-switch" id="session-switch" type="button" title="Sessions">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span class="session-name">…</span>
        <span class="caret">▾</span>
      </button>
      <span class="session-hint">Sessions</span>
    </div>
  </header>

  <main class="learning">
    <div class="context">
      <span class="context-source" id="context-source">…</span>
      <div class="progress">
        <span class="track"><span class="fill" id="progress-fill"></span></span>
        <span class="pct" id="progress-pct">0%</span>
      </div>
    </div>

    <section class="card" id="card" style="--type: var(--t-L)"></section>

    <div class="lookahead" id="lookahead">
      <div class="la-inner">
        <button class="binocular" id="binocular" type="button" aria-label="Collapse look-ahead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 11.5V6h3l1.2 5.5M17.5 11.5V6h-3l-1.2 5.5"/><circle cx="7" cy="15.5" r="4"/><circle cx="17" cy="15.5" r="4"/><path d="M11 12.5h2"/></svg></button>
        <div class="la-track" id="la-track"></div>
        <svg class="nest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 13c0 3.6 3.8 6.5 8.5 6.5s8.5-2.9 8.5-6.5"/><path d="M3.5 13c2.2-2 5.4-3 8.5-3s6.3 1 8.5 3"/><path d="M6 10.5 4.2 8.8M9 9.6 8 7.6M12 9.2V7M15 9.6 16 7.6M18 10.5 19.8 8.8"/></svg>
      </div>
    </div>
  </main>

  <section class="search">
    <div class="search-body">
      <div class="search-left">
        <div class="search-head">
          <span class="search-label">Search</span>
          <input class="search-input" id="search-input" type="search" placeholder="Latin, English or Hebrew" autocomplete="off" spellcheck="false">
          <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" title="Clear search">×</button>
          <span class="q-label">this search</span>
          <div class="q-actions" id="q-actions">
            <button type="button" disabled style="--type: var(--t-L)"><span class="dot"></span>Learn</button>
            <button type="button" disabled style="--type: var(--t-E)"><span class="dot"></span>Elements</button>
            <button type="button" disabled style="--type: var(--t-R)"><span class="dot"></span>Recognize</button>
            <button type="button" disabled style="--type: var(--t-C)"><span class="dot"></span>Construct</button>
            <button type="button" disabled style="--type: var(--t-F)"><span class="dot"></span>Produce</button>
            <button type="button" disabled><span class="dot dot--neutral"></span>Session</button>
          </div>
        </div>

        <div class="results">
          <div class="results-head">
            <span class="col">Latin</span>
            <span class="col">Order</span>
            <span class="col">Family</span>
            <span class="col">English</span>
            <span class="col col--end">Hebrew</span>
          </div>
          <div id="results"></div>
        </div>
      </div>

      <aside class="bird-panel" id="panel"></aside>
    </div>
  </section>

  <div class="status" id="status" role="status"></div>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
